services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: multimodal_video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "echo api placeholder"
    volumes:
      - ..:/workspace
    depends_on:
      - postgres
      - redis

  worker:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "echo worker placeholder"
    volumes:
      - ..:/workspace
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
